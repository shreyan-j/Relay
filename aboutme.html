<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        :root {
            --theme-color: #5be779;
            /* --theme-color: #5be779; */
            --theme-dark: #000000;
            --theme-light: #fafafa;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
            height: 100vh;
            padding: 0px;
            margin: 0px;
            background: linear-gradient(0deg, var(--theme-color), #000000);
            transition: all 2s ease;
        }

        .flex-hor {
            display: flex;
            flex-direction: row;
        }

        .flex-ver {
            display: flex;
            flex-direction: column;
        }

        .demo-white-bg {
            background-color: rgba(225, 225, 225, 0.2);
        }

        #nav-bar {
            position: fixed;
            top: 0;
            left: 0;
            margin-top: 0px;
            padding-top: 0px;
            border: none;
            border-bottom: 1px solid white;
            border-radius: 45px;
            height: 10vh;
            width: 100%;
            box-sizing: border-box;
            align-items: center;
            justify-content: space-around;
            font-family: "Raleway", sans-serif;
            font-size: 20px;
        }

        #nav-bar>div {
            color: var(--theme-color);
            cursor: pointer;
            transition: all 0.5s ease-in;
            /* border: 1px solid rgba(225, 225, 225, 0); */
            padding: 0.8%;
            border-radius: 20%;
        }

        #nav-bar>div:hover {
            color: white;
            transform: scale(1.3);
            /* font-size: 25px; */
            /* border: 1px solid rgba(225, 225, 225, 0.2); */
        }

        #page-title {
            width: 100%;
            /* height: 20%; */
            text-align: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 25px;
            align-items: center;
            justify-content: space-around;
            color: white;
        }
    </style>
</head>

<body>
    <div id="nav-bar" class="nav-bar flex-hor">
        <div id="nav-bar-home" class="nav-bar-text">Home </div>
        <div id="nav-bar-about" class="nav-bar-text">About me</div>
        <div id="nav-bar-contact-us" class="nav-bar-text">Contact me</div>
        <div id="nav-bar-account" class="nav-bar-text">Account</div>
        <div id="nav-bar-donate" class="nav-bar-text">Donate</div>
    </div>
    <div id="page-title">About Me</div>
</body>

</html>
